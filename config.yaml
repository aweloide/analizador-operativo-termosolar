# Configuración de Intervalos de Actualización
update_intervals:
  realtime:
    enabled: true
    interval_ms: 30000  # 30 segundos para snapshots

  historical_recent:
    enabled: true
    interval_ms: 60000  # 60 segundos para datos históricos recientes

  historical_long:
    enabled: false  # Solo bajo demanda (cuando el usuario cambia selector)

# Configuración de Caché
cache:
  snapshot_ttl: 60       # TTL para snapshots en segundos
  historical_1h_ttl: 300  # TTL para históricos de 1 hora (5 min)
  historical_24h_ttl: 600 # TTL para históricos de 24h (10 min)
  historical_7d_ttl: 1800 # TTL para históricos de 7d (30 min)
  historical_30d_ttl: 3600 # TTL para históricos de 30d (1 hora)

# Configuración de la Aplicación
app:
  title: "Analizador Ciclo Termodinámico"
  debug: true
  host: "127.0.0.1"
  port: 8050

# Límites de Datos
data_limits:
  max_realtime_points: 100
  max_historical_points: 10000
  aggregation_threshold: 5000  # Agregar si > 5000 puntos
  timeout_seconds: 10  # Timeout para consultas a PI

# Configuración de Gráficos
charts:
  theme: "plotly_white"
  show_legend: true
  hovermode: "x unified"

# Notas sobre Tags
# Los tags que aparecen aquí son placeholders.
# El usuario debe proporcionar los tags reales de su servidor PI.
# Una vez que proporcione los tags, reemplazar en las secciones correspondientes.
#
# Ejemplo de tags reales:
# - 13WSH10CT999A.Out (radiación solar)
# - PTE1.POWER.NET (potencia neta)
# - PTE1.HTF.TEMP.HOT (temperatura HTF caliente)
